services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chromadb:
    image: ghcr.io/chroma-core/chroma:0.5.23
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_PROCESSED_PATH=/data/processed
      - KEDB_DB_PATH=/data/kedb/kedb.db
      - KEDB_DOCS_PATH=/data/kedb/articles
    volumes:
      - ./data/processed:/data/processed
      - ./data/raw:/data/raw
      - kedb_data:/data/kedb
      - ./data/kedb/articles:/data/kedb/articles
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build: .
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_PROCESSED_PATH=/data/processed
      - KEDB_DB_PATH=/data/kedb/kedb.db
      - KEDB_DOCS_PATH=/data/kedb/articles
    volumes:
      - ./data/processed:/data/processed
      - ./data/raw:/data/raw
      - kedb_data:/data/kedb
      - ./data/kedb/articles:/data/kedb/articles
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "app.jobs.worker.WorkerSettings"]

  web:
    build:
      context: ./web
      args:
        # Same-origin proxy via nginx (avoids flaky localhost:8000 on Docker Desktop)
        VITE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  pipeline:
    build: .
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATA_PROCESSED_PATH=/data/processed
      - KEDB_DB_PATH=/data/kedb/kedb.db
      - KEDB_DOCS_PATH=/data/kedb/articles
    volumes:
      - ./data/processed:/data/processed
      - ./data/raw:/data/raw
      - kedb_data:/data/kedb
      - ./data/kedb/articles:/data/kedb/articles
    depends_on:
      chromadb:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.pipeline.cli"]
    profiles:
      - pipeline

volumes:
  chroma_data:
  kedb_data:
