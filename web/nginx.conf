server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker embedded DNS — re-resolve api after recreates (avoids stale 502)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        # With a variable in proxy_pass, nginx does NOT strip /api/ automatically.
        # Rewrite so /api/kedb/pendientes → /kedb/pendientes on the backend.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
