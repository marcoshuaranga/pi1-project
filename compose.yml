services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  chromadb:
    image: ghcr.io/chroma-core/chroma:0.5.23
    ports:
      - "8001:8000"
    restart: on-failure
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    deploy:
      resources:
        # Batched KEDB clustering still loads HNSW; 3G reduces disconnects vs dumping all embeddings
        limits:
          cpus: "2.00"
          memory: 3G
        reservations:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    restart: on-failure
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_PROCESSED_PATH=/data/processed
      - KEDB_DB_PATH=/data/kedb/kedb.db
      - KEDB_DOCS_PATH=/data/kedb/articles
      - LITELLM_BASE_URL=http://litellm:4000
    volumes:
      - ./app:/app/app
      - ./data/processed:/data/processed
      - ./data/raw:/data/raw
      - ./data/fixtures:/data/fixtures
      - kedb_data:/data/kedb
      - ./data/kedb/articles:/data/kedb/articles
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    deploy:
      resources:
        # spaCy lg + embedder + uvicorn (1 proceso) + to_thread; 3G evita OOM sin sobredimensionar
        limits:
          cpus: "2.00"
          memory: 3G
        reservations:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build: .
    restart: on-failure
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_PROCESSED_PATH=/data/processed
      - KEDB_DB_PATH=/data/kedb/kedb.db
      - KEDB_DOCS_PATH=/data/kedb/articles
      # HDBSCAN/numpy aprovechan varios cores dentro del límite del contenedor
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - NUMEXPR_NUM_THREADS=4
      - LITELLM_BASE_URL=http://litellm:4000
    volumes:
      - ./data/processed:/data/processed
      - ./data/raw:/data/raw
      - ./data/fixtures:/data/fixtures
      - kedb_data:/data/kedb
      - ./data/kedb/articles:/data/kedb/articles
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    deploy:
      resources:
        # max_jobs=1: un job pesado (HDBSCAN/eval); 4G+4CPU es el punto eficiente en demo local
        limits:
          cpus: "4.00"
          memory: 4G
        reservations:
          cpus: "1.00"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s

  web:
    build:
      context: ./web
      args:
        # Same-origin proxy via nginx (avoids flaky localhost:8000 on Docker Desktop)
        VITE_API_URL: /api
    ports:
      - "3000:80"
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s

  pipeline:
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATA_PROCESSED_PATH=/data/processed
      - KEDB_DB_PATH=/data/kedb/kedb.db
      - KEDB_DOCS_PATH=/data/kedb/articles
      - OMP_NUM_THREADS=6
      - OPENBLAS_NUM_THREADS=6
      - MKL_NUM_THREADS=6
      - NUMEXPR_NUM_THREADS=6
    volumes:
      - ./data/processed:/data/processed
      - ./data/raw:/data/raw
      - ./data/fixtures:/data/fixtures
      - kedb_data:/data/kedb
      - ./data/kedb/articles:/data/kedb/articles
    depends_on:
      chromadb:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.pipeline.cli"]
    profiles:
      - pipeline
    deploy:
      resources:
        # Solo al re-ingerir/embeber; batch embeddings + spaCy
        limits:
          cpus: "6.00"
          memory: 6G
        reservations:
          cpus: "2.00"
          memory: 2G

volumes:
  chroma_data:
  kedb_data:
