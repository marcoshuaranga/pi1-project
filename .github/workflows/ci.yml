name: CI

# Deshabilitado: no corre en push/PR. Reactivar con:
#   on:
#     push:
#       branches: [main, master]
#     pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check app tests

      - name: Test
        run: uv run pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t pi1-api .

      - name: Build Web image
        run: docker build -t pi1-web ./web --build-arg VITE_API_URL=http://localhost:8000
