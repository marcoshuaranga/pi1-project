name: CI

# Deshabilitado: no corre en push/PR. Reactivar con:
#   on:
#     push:
#       branches: [main, master]
#     pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t pi1-api .

      - name: Build Web image
        run: docker build -t pi1-web ./web --build-arg VITE_API_URL=http://localhost:8000
