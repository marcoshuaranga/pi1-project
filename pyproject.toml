# Raíz del uv workspace. Es un meta-proyecto no empaquetable: solo agrupa los
# miembros (packages/core, apps/*) para que `uv sync` / `uv run pytest` en la
# raíz instalen todo, y aloja el tooling de desarrollo compartido.
# Las dependencias reales de cada servicio viven en su propio pyproject.toml.
[project]
name = "pi1-rag-kedb"
version = "0.1.0"
description = "Plataforma multi-agente RAG + KEDB — Mesa de Ayuda OITSI-MTC"
requires-python = ">=3.11"
dependencies = [
    "pi-core",
    "pi-api",
    "pi-worker",
    "pi-pipeline",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
pi-core = { workspace = true }
pi-api = { workspace = true }
pi-worker = { workspace = true }
pi-pipeline = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Each member owns its tests; `uv run pytest` at the root runs all of them.
testpaths = ["packages/core/tests", "apps/api/tests", "apps/worker/tests", "apps/pipeline/tests"]
markers = [
    "integration: requires live services (Chroma, embedding provider) — see docker compose up",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`, not worth enforcing separately

[tool.ruff.lint.per-file-ignores]
# Scripts add the repo root to sys.path before importing pi_core (runs inside Docker).
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pi_core", "pi_api", "pi_worker", "pi_pipeline"]
