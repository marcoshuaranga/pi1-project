[project]
name = "pi-worker"
version = "0.1.0"
description = "ARQ worker (pi1-rag-kedb)"
requires-python = ">=3.11"
dependencies = [
    "pi-core",
    "arq>=0.26.0",
    "redis>=5.0.0",
]

[tool.uv.sources]
pi-core = { workspace = true }

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
