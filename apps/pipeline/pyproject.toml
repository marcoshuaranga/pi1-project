[project]
name = "pi-pipeline"
version = "0.1.0"
description = "Batch DVC ingest CLI (pi1-rag-kedb)"
requires-python = ">=3.11"
dependencies = [
    "pi-core",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "openpyxl>=3.1.0",
]

[tool.uv.sources]
pi-core = { workspace = true }

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
