[project]
name = "pi-core"
version = "0.1.0"
description = "Dominio compartido: schemas, agentes, storage, services, anonimizacion, cola (pi1-rag-kedb)"
requires-python = ">=3.11"
# Lista provisional — se ajusta con grep de imports reales en la Fase 2.
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.55.0",
    "chromadb==0.5.23",
    "posthog>=2.4.0,<6.0.0",
    "langgraph>=0.2.60",
    "langchain>=1.0.0",
    "langchain-core",
    "openpyxl>=3.1.0",
    "langchain-openai>=0.2.10",
    "langchain-anthropic>=1.0.0",
    "spacy>=3.8.0",
    "hdbscan>=0.8.38",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "fastembed>=0.4.2",
    "arq>=0.26.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_core = ["fixtures/*.json"]
